# dmonk proof package: core Lean 4 only (no Mathlib, no Batteries).
# `lake build` compiles model.lean, smoke.lean and moe.lean; all compile standalone
# with `lean <file>.lean` since they import nothing beyond Init.
name = "dmonkproof"
defaultTargets = ["Model", "Smoke", "Moe"]

[[lean_lib]]
name = "Model"
roots = ["model"]

[[lean_lib]]
name = "Smoke"
roots = ["smoke"]

[[lean_lib]]
name = "Moe"
roots = ["moe"]
